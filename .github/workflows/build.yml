name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Force python3 to be Python 3.10
        run: |
          echo "=== BEFORE ==="
          which python; python --version
          which python3; python3 --version
          which pip; pip --version
          which pip3; pip3 --version

          PYTHON_BIN=$(which python)
          PIP_BIN=$(which pip)

          sudo ln -sf "$PYTHON_BIN" /usr/local/bin/python3
          sudo ln -sf "$PIP_BIN" /usr/local/bin/pip3

          hash -r
          echo "=== AFTER ==="
          which python3; python3 --version
          which pip3; pip3 --version
          python3 -c "import cgi; print('python3 cgi OK')"
          python -c "import cgi; print('python cgi OK')"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bdaconnection-apk
          path: bin/*.apk
          retention-days: 30
