name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix python3 jadi 3.10
        run: |
          PY=$(which python)
          echo "Python 3.10 di: $PY"
          sudo rm -f /usr/bin/python3
          sudo rm -f /usr/bin/python3.13
          sudo rm -f /usr/bin/python3.14
          sudo ln -sf "$PY" /usr/bin/python3
          hash -r
          python3 --version
          python3 -c "import cgi; print('cgi OK dari python3')"
          python -c "import cgi; print('cgi OK dari python')"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3.10-venv

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Verifikasi
        run: |
          which python3
          python3 --version
          which buildozer

      - name: Build APK
        run: yes | buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: bdaconnection-apk
          path: bin/*.apk
          retention-days: 30
