name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Force python3 ke 3.10 (aggressive)
        run: |
          PYTHON_BIN=$(which python)
          echo "Python 3.10 location: $PYTHON_BIN"
          $PYTHON_BIN --version

          echo "=== SEBELUM ==="
          ls -la /usr/bin/python3* || true
          ls -la /usr/local/bin/python3* || true
          which python3
          python3 --version || true

          sudo ln -sf "$PYTHON_BIN" /usr/local/bin/python3
          sudo ln -sf "$PYTHON_BIN" /usr/bin/python3

          sudo rm -f /usr/bin/python3.14 2>/dev/null || true
          sudo rm -f /usr/local/bin/python3.14 2>/dev/null || true
          sudo rm -f /usr/bin/python3.13 2>/dev/null || true

          hash -r

          echo "=== SESUDAH ==="
          which python3
          python3 --version
          python3 -c "import cgi; print('python3 cgi OK')"
          python -c "import cgi; print('python cgi OK')"

          rm -rf ~/.buildozer/android/platform/build-* || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bdaconnection-apk
          path: bin/*.apk
          retention-days: 30
